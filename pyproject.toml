[project]
name = "jenkins-aiops"
version = "0.3.0"
description = "Analyze Jenkins build logs with a locally hosted LLM."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "black>=26.5.1",
    "fastapi>=0.115,<1",
    "flake8>=7.3.0",
    "pydantic>=2.9,<3",
    "python-jenkins>=1.8,<2",
    "requests>=2.32,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "src"]
