services:
  api:
    build: .
    ports:
      - "8000:8000"
      - "5000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${DOCKER_OLLAMA_MODEL:-qwen3:1.7b}
      DATABASE_PATH: /data/jenkins-aiops.db
    volumes:
      - api-data:/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; \
          urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ollama-data:
  api-data:
